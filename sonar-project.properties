# ==============================================================================
# SonarQube Scanner Configuration for EduSprint Platform
# SAKEC DevSecOps Lab - Static Application Security Testing (SAST)
# ==============================================================================

# Mandatory Project Identification
sonar.projectKey=edusprint-platform
sonar.projectName=EduSprint - Agile Project Planning & Risk Monitoring for E-Learning
sonar.projectVersion=1.1.0

# Source Directories
sonar.sources=frontend/src,backend/src

# File Encoding
sonar.sourceEncoding=UTF-8

# Analysis Exclusions (Dependencies, Generated Bundles, Release Binaries)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/public/**,**/EduSprint-Release/**,**/*.sqlite,**/*.log

# Quality Gate Settings
sonar.qualitygate.wait=true
